<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17363A">
  <meta name="description" content="平遥国际电影节2026观影日历，提供电影排片查询、观影日程管理、智能观影安排及观影日历生成。">
  <title>平遥 2026 · 观影日历</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="head"><img src="assets/header.jpg" alt="平遥电影节" /></header>

  <nav class="days" id="days"></nav>

  <section class="smartBox" id="smartBox">
    <img class="ticketIcon" src="assets/ticket.png" alt="">
    <div><div class="smartTitle">智能安排今日</div><div class="smartDesc">电影节履历 60% · 主创关注度 30% · 映前映后 10%</div></div>
    <button id="makeSmart">开始安排</button>
  </section>
  <div class="tip" id="tip"></div>
  <div class="allTip" id="allTip" hidden>全部：显示 9/24—9/30 的全部排片，可直接查看并调整各日选择。</div>

  <main id="timeline"></main>

  <div class="bottomBar">
    <img class="bottomFilm" src="assets/reel.png" alt="">
    <div class="chosen">已选 <b id="selectedCount">0</b> 场电影<span id="activityCountText"></span></div>
    <div class="bottomBtns">
      <button id="makeCalendar">生成今日观影日历</button>
      <button class="fullBtn" id="makeFullCalendar">生成全程观影日历</button>
    </div>
  </div>
</div>

<div class="mask" id="smartModal" hidden>
  <section class="sheet smartSheet">
    <div class="sheetTop"><div><div class="smartSheetTitle" id="smartTitle"></div><div class="smartSheetSub">大师·对话已加入候选时间表；电影按 60% 电影节履历 + 30% 主创关注度 + 10% 映前映后活动计算。你也可以直接点每一项的＋/−调整。</div></div><button class="close" data-close="smartModal">×</button></div>
    <div class="smartSectionTitle">大师·对话 <small>MASTERCLASS</small></div>
    <div id="smartActivities"></div>
    <div class="smartSectionTitle">推荐电影 <small>FILMS</small></div>
    <div id="smartFilms"></div>
    <div class="formula" id="smartNote"></div>
    <div class="smartActions"><button id="applySmart">加入今日安排</button><button class="secondary" data-close="smartModal">再自己选</button></div>
  </section>
</div>

<div class="mask" id="calendarModal" hidden>
  <section class="sheet calendarSheet">
    <div class="sheetTop"><div><div class="calendarTitle" id="calendarTitle"></div><div class="calendarSub" id="calendarSub"></div></div><button class="close" data-close="calendarModal">×</button></div>
    <div class="calendarConfirm">
      <div class="confirmIcon">✓</div>
      <div class="confirmTitle">观影日程已生成</div>
      <div class="confirmText" id="calendarConfirmText"></div>
      <div class="ready" id="ready">正在生成图片……</div>
    </div>
    <canvas id="shareCanvas" width="750" height="1200" class="canvasHidden" aria-hidden="true"></canvas>
    <div class="actions"><button id="saveImage" disabled>保存图片</button><button class="cancelBtn" data-close="calendarModal">返回继续选片</button></div>
  </section>
</div>

<div class="saveGuideMask" id="saveGuideMask" hidden>
  <section class="saveGuide">
    <div class="saveGuideTop">
      <div>
        <div class="saveGuideTitle">观影日历已生成</div>
        <div class="saveGuideSub">在微信中，请长按下方图片保存到手机相册。</div>
      </div>
      <button class="saveGuideClose" id="closeSaveGuide" aria-label="关闭">×</button>
    </div>
    <div class="saveGuideImgWrap"><img class="saveGuideImg" id="saveGuideImg" alt="生成的观影日历"></div>
    <div class="saveGuideTip">长按图片 → 保存图片<small>保存后可继续分享给朋友</small></div>
    <button class="saveGuideBack" id="backFromSaveGuide">返回继续选片</button>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="activities.js"></script>
<script src="film_details.js"></script>
<script src="smart_profile.js"></script>
<script src="poster_map.js"></script>
<script src="ticket_links.js"></script>
<script src="app.js"></script>
</body>
</html>
